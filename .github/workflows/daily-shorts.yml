name: Daily Automated YouTube Shorts Publisher

on:
  schedule:
    # 5 Daily Slots in UTC (IST = UTC + 5:30):
    # Slot 1: 09:00 AM IST -> 03:30 AM UTC
    - cron: '30 3 * * *'
    # Slot 2: 02:00 PM IST -> 08:30 AM UTC
    - cron: '30 8 * * *'
    # Slot 4: 05:00 PM IST -> 11:30 AM UTC
    - cron: '30 11 * * *'
    # Slot 3: 07:30 PM IST -> 02:00 PM UTC
    - cron: '0 14 * * *'
    # Slot 5: 09:00 PM IST -> 03:30 PM UTC (Cricket / IPL Buzz)
    - cron: '30 15 * * *'

  workflow_dispatch:
    inputs:
      slot:
        description: 'Target Slot to publish'
        required: true
        default: 'slot1'
        type: choice
        options:
          - slot1
          - slot2
          - slot3
          - slot4
          - slot5
      customTopic:
        description: 'Optional custom topic'
        required: false
        default: ''
      privacy:
        description: 'Upload privacy status'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private

jobs:
  publish-short:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Install Node Dependencies
        run: npm install

      - name: Force System FFmpeg with Drawtext
        run: |
          which ffmpeg
          ffmpeg -version | grep -i drawtext || true
          if [ -d "node_modules/ffmpeg-static" ]; then
            cp $(which ffmpeg) node_modules/ffmpeg-static/ffmpeg
          fi

      - name: Run Cloud Shorts Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_SLOT: ${{ github.event.inputs.slot }}
          CUSTOM_TOPIC: ${{ github.event.inputs.customTopic }}
          PRIVACY_STATUS: ${{ github.event.inputs.privacy || 'public' }}
        run: node src/cloud_publisher.js
