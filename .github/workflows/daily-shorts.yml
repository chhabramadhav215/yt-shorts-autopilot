name: Daily Automated YouTube Shorts Publisher

on:
  schedule:
    - cron: '30 3 * * *'
    - cron: '30 8 * * *'
    - cron: '30 11 * * *'
    - cron: '0 14 * * *'

  workflow_dispatch:
    inputs:
      slot:
        description: 'Target Slot to publish'
        required: true
        default: 'slot1'
        type: choice
        options:
          - slot1
          - slot2
          - slot3
          - slot4
      customTopic:
        description: 'Optional custom topic'
        required: false
        default: ''
      privacy:
        description: 'Upload privacy status'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private

concurrency:
  group: youtube-shorts-publishing
  cancel-in-progress: false

jobs:
  publish-short:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-freefont-ttf

      - name: Install Node Dependencies
        run: npm install

      - name: Run Cloud Shorts Publisher
        env:
          TARGET_SLOT: ${{ inputs.slot || 'slot1' }}
          CUSTOM_TOPIC: ${{ inputs.customTopic || '' }}
          UPLOAD_PRIVACY: ${{ inputs.privacy || 'public' }}
          YOUTUBE_PRIVACY_STATUS: ${{ inputs.privacy || 'public' }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/cloud_publisher.js
