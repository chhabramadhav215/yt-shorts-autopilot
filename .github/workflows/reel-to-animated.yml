name: Reel to Animated Short

on:
  workflow_dispatch:
    inputs:
      reel_url:
        description: 'Reel or Video URL to convert'
        required: true
        type: string
      title:
        description: 'Optional custom title (leave empty for auto-title)'
        required: false
        default: ''
        type: string
      privacy:
        description: 'Upload privacy status'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private

jobs:
  convert-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System FFmpeg, Subtitle Fonts & yt-dlp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-noto-color-emoji
          fc-cache -fv
          pip install --upgrade yt-dlp
          echo "FFMPEG_PATH=/usr/bin/ffmpeg" >> $GITHUB_ENV
          echo "FFPROBE_PATH=/usr/bin/ffprobe" >> $GITHUB_ENV

      - name: Install Node Dependencies
        run: npm install

      - name: Override Static FFmpeg with System Binary
        run: |
          mkdir -p node_modules/ffmpeg-static
          cp -f /usr/bin/ffmpeg node_modules/ffmpeg-static/ffmpeg || true
          chmod +x node_modules/ffmpeg-static/ffmpeg || true

      - name: Run Reel to Animated Converter & Publisher
        env:
          REEL_URL: ${{ github.event.inputs.reel_url }}
          CUSTOM_TITLE: ${{ github.event.inputs.title }}
          PRIVACY_STATUS: ${{ github.event.inputs.privacy || 'public' }}
          FFMPEG_PATH: ${{ env.FFMPEG_PATH }}
          FFPROBE_PATH: ${{ env.FFPROBE_PATH }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN || secrets.PAGE_ACCESS_TOKEN }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN || secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID || secrets.IG_USER_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || secrets.FACEBOOK_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/reel_to_animated.js
